<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة نسك برو | إدارة وتسجيل المعتمرين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-2xl font-black text-amber-500">نظام نسك الذكي للأتمتة</h1>
                <p class="text-xs text-slate-400 mt-1">معالجة الكشوفات، استخراج التأشيرات، وإدارة حالات التسجيل فورياً</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="systemStatus" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-semibold bg-emerald-950 text-emerald-400 border border-emerald-800">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> متصل بالسيرفر
                </span>
            </div>
        </header>

        <!-- Configuration Bar -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <label class="block text-xs font-bold text-slate-300 mb-1">البريد الإلكتروني (جيميل)</label>
                <input id="clientEmail" type="email" placeholder="example@gmail.com" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 outline-none text-left" dir="ltr">
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
                <label class="block text-xs font-bold text-slate-300 mb-1">كلمة مرور التطبيقات (App Password)</label>
                <input id="clientPass" type="password" placeholder="16 حرف من Google" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:border-amber-500 outline-none text-left" dir="ltr">
            </div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex items-end gap-2">
                <label class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg px-4 py-2 text-sm font-semibold cursor-pointer text-center transition">
                    📂 رفع كشف إكسيل
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden">
                </label>
                <button id="startBtn" onclick="startProcessing()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-5 py-2 rounded-lg text-sm transition">
                    بدء العمل
                </button>
                <button id="exportBtn" onclick="exportUpdatedExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition" title="تنزيل الإكسيل المحدث">
                    📥 تصدير
                </button>
            </div>
        </div>

        <!-- Table View -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-200">كشف المعتمرين (<span id="totalCount">0</span>)</h3>
                <div class="text-xs text-slate-400">تحديث تلقائي وفوري لحالة كل معتمر مع التخطي الآمن</div>
            </div>
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-right text-xs">
                    <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-800 sticky top-0">
                        <tr>
                            <th class="p-3">#</th>
                            <th class="p-3">الاسم</th>
                            <th class="p-3">رقم الجواز</th>
                            <th class="p-3">رقم التأشيرة</th>
                            <th class="p-3">الحالة</th>
                            <th class="p-3">ملاحظات النظام</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y border-slate-800 text-slate-300">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500">قم برفع ملف الإكسيل لعرض الكشف بالكامل هنا</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let rawPilgrimsData = [];
        let isRunning = false;

        // دالة استخراج ذكية جداً تفحص جميع المفاتيح بغض النظر عن الهمزات والتاء المربوطة
        function getPilgrimValue(row, possibleNames) {
            for (let key of Object.keys(row)) {
                let cleanKey = key.toString().trim()
                    .replace(/[\u064B-\u065F]/g, '') // حذف التشكيل
                    .replace(/[أإآ]/g, 'ا')
                    .replace(/ة/g, 'ه')
                    .replace(/\s+/g, '');

                for (let target of possibleNames) {
                    let cleanTarget = target.trim()
                        .replace(/[أإآ]/g, 'ا')
                        .replace(/ة/g, 'ه')
                        .replace(/\s+/g, '');

                    if (cleanKey === cleanTarget || cleanKey.includes(cleanTarget)) {
                        let val = row[key];
                        return (val !== undefined && val !== null) ? val.toString().trim() : "";
                    }
                }
            }
            return "";
        }

        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = evt.target.result;
                const workbook = XLSX.read(data, { type: 'binary' });
                
                // قراءة أول شيت موجود أياً كان اسمه (سواء Data أو غيره)
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                
                // raw: false لضمان قراءة الأرقام الطويلة كنصوص بدقة وبدون تقريب علمي
                rawPilgrimsData = XLSX.utils.sheet_to_json(sheet, { raw: false, defval: "" });
                
                rawPilgrimsData.forEach(p => {
                    p["حالة التسجيل"] = p["حالة التسجيل"] || p["حالة الحجز"] || "قيد الانتظار";
                    p["ملاحظات"] = p["ملاحظات"] || "-";
                });

                renderTable();
            };
            reader.readAsBinaryString(file);
        });

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            document.getElementById('totalCount').innerText = rawPilgrimsData.length;
            tbody.innerHTML = '';

            rawPilgrimsData.forEach((p, idx) => {
                const name = getPilgrimValue(p, ["الاسم", "الاسم بالكامل", "Name", "full_name"]) || "-";
                const passport = getPilgrimValue(p, ["رقم الجواز", "الجواز", "passport", "Passport"]) || "-";
                const visa = getPilgrimValue(p, ["رقم التاشيرة", "رقم التاشيره", "التاشيرة", "التاشيره", "visa", "Visa"]) || "-";
                
                const status = p["حالة التسجيل"] || "قيد الانتظار";
                const notes = p["ملاحظات"] || "-";

                let badgeColor = "bg-slate-800 text-slate-300";
                if (status === "تم التسجيل") badgeColor = "bg-emerald-950 text-emerald-400 border border-emerald-800";
                if (status === "البيانات مسجلة مسبقاً") badgeColor = "bg-amber-950 text-amber-400 border border-amber-800";
                if (status === "فشل التسجيل") badgeColor = "bg-rose-950 text-rose-400 border border-rose-800";
                if (status === "جاري التنفيذ...") badgeColor = "bg-cyan-950 text-cyan-400 border border-cyan-800 animate-pulse";

                const tr = `
                    <tr class="hover:bg-slate-800/40 transition">
                        <td class="p-3 text-slate-500">${idx + 1}</td>
                        <td class="p-3 font-semibold text-slate-200">${name}</td>
                        <td class="p-3 font-mono text-slate-300">${passport}</td>
                        <td class="p-3 font-mono text-amber-400 font-bold">${visa}</td>
                        <td class="p-3"><span class="px-2.5 py-1 rounded-full text-[11px] font-bold ${badgeColor}">${status}</span></td>
                        <td class="p-3 text-slate-400 text-[11px]">${notes}</td>
                    </tr>
                `;
                tbody.innerHTML += tr;
            });
        }

        async function startProcessing() {
            const email = document.getElementById('clientEmail').value.trim();
            const pass = document.getElementById('clientPass').value.trim();

            if (!email || !pass) {
                alert("يرجى إدخال الجيميل وكلمة مرور التطبيقات أولاً.");
                return;
            }
            if (rawPilgrimsData.length === 0) {
                alert("يرجى تحميل ملف إكسيل أولاً.");
                return;
            }

            isRunning = true;
            document.getElementById('startBtn').disabled = true;

            for (let i = 0; i < rawPilgrimsData.length; i++) {
                if (!isRunning) break;
                const p = rawPilgrimsData[i];

                if (p["حالة التسجيل"] === "تم التسجيل" || p["حالة التسجيل"] === "البيانات مسجلة مسبقاً") {
                    continue;
                }

                p["حالة التسجيل"] = "جاري التنفيذ...";
                p["ملاحظات"] = "جاري إدخال البيانات في تطبيق نسك...";
                renderTable();

                try {
                    const res = await fetch("http://127.0.0.1:8000/api/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            client_email: email,
                            client_pass: pass,
                            pilgrim: p
                        })
                    });
                    const result = await res.json();

                    if (result.success) {
                        p["حالة التسجيل"] = "تم التسجيل";
                        p["حالة الحجز"] = "تم التسجيل";
                        p["ملاحظات"] = `ناجح (كود OTP: ${result.otp || 'نعم'})`;
                    } else {
                        if (result.status === "already_registered") {
                            p["حالة التسجيل"] = "البيانات مسجلة مسبقاً";
                            p["حالة الحجز"] = "مسجل مسبقاً";
                            p["ملاحظات"] = "تم اكتشاف تسجيل مسبق - تم التخطي بأمان";
                        } else {
                            p["حالة التسجيل"] = "فشل التسجيل";
                            p["حالة الحجز"] = "فشل";
                            p["ملاحظات"] = result.error || "خطأ في المعالجة";
                        }
                    }
                } catch (err) {
                    p["حالة التسجيل"] = "فشل التسجيل";
                    p["ملاحظات"] = "تعذر الاتصال بالسيرفر المحلي";
                }

                renderTable();
            }

            isRunning = false;
            document.getElementById('startBtn').disabled = false;
            alert("تم الانتهاء من معالجة الكشف بالكامل!");
        }

        function exportUpdatedExcel() {
            if (rawPilgrimsData.length === 0) {
                alert("لا توجد بيانات لتصديرها.");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(rawPilgrimsData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "النخبه_المحدث");
            XLSX.writeFile(workbook, "النخبه_حجز_26_محدث.xlsx");
        }
    </script>
</body>
</html>
